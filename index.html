<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Vaemir — E-mail confirmado</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;

            background:
                radial-gradient(
                    circle at top,
                    #2b1b0b,
                    #0d0905 55%,
                    #050403
                );

            color: #ead9a5;
            font-family:
                Georgia,
                "Times New Roman",
                serif;
        }

        .caixa {
            width: min(560px, 100%);
            padding: 42px 32px;

            border:
                1px solid rgba(
                    197,
                    150,
                    66,
                    0.45
                );

            border-radius: 14px;

            background:
                rgba(
                    8,
                    6,
                    4,
                    0.88
                );

            box-shadow:
                0 18px 50px
                rgba(
                    0,
                    0,
                    0,
                    0.45
                );

            text-align: center;
        }

        .marca {
            margin-bottom: 12px;

            color: #b9914e;

            font-size: 12px;
            font-weight: bold;

            letter-spacing: 4px;
        }

        h1 {
            margin: 0;

            color: #f0d18c;

            font-size: 42px;
            font-weight: normal;
        }

        p {
            margin:
                18px 0 0;

            color: #b9a783;

            font-size: 18px;
            line-height: 1.6;
        }

        .linha {
            width: 90px;
            height: 1px;

            margin:
                26px auto;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #b88a3e,
                    transparent
                );
        }

        strong {
            color: #e4c47f;
        }
    </style>
</head>

<body>

    <main class="caixa">

        <div class="marca">
            VAEMIR
        </div>

        <h1>
            E-mail confirmado
        </h1>

        <div class="linha"></div>

        <p>
            Sua conta foi confirmada com sucesso.
        </p>

        <p>
            Você já pode voltar ao
            <strong>Vaemir</strong>
            e entrar normalmente.
        </p>

    </main>

</body>
</html>
